spring:
  application:
    name: medmaxpub-api
  config:
    import: optional:file:.env[.properties]
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/medmaxpub}
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 60MB

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production}
    expiration: ${JWT_EXPIRATION:86400000}
  cors:
    allowed-origin: ${FRONTEND_URL:http://localhost:5173}
  bootstrap:
    admin-email: ${ADMIN_BOOTSTRAP_EMAIL:admin@medmaxpub.com}
    admin-password: ${ADMIN_BOOTSTRAP_PASSWORD:ChangeMe123!}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
